# DESPLIEGUE EN AZURE STATIC WEB APPS.
#
# Este archivo lo generó Azure al crear el recurso, y venía con la plantilla por
# defecto: `output_location: ""`, que publica la RAÍZ DEL REPOSITORIO. Para un
# sitio Astro eso significa subir los `.astro` sin construir en vez del HTML.
# Aquí está corregido y parametrizado.
#
# LAS VARIABLES SON DE REPOSITORIO, NO SECRETOS. Se cambian en
# Settings › Secrets and variables › Actions › Variables, sin tocar código.
# Ninguna es un secreto: `SITE_URL` y los dos flags de poda son decisiones de
# construcción, y las `PUBLIC_*` acaban dentro del JavaScript que sirve el sitio
# —por eso llevan ese prefijo—. El único secreto real es el token de despliegue
# de Azure, que sí vive en Secrets.
#
#   SITE_URL                    dominio canónico (canonical, sitemap, robots, JSON-LD)
#   SOLO_LANDING=1              poda dist/ al teaser followdafox
#   SOLO_LANZAMIENTO=1          poda dist/ a la puerta de lanzamiento
#                               NO combinar las dos: el build falla a propósito
#   PUBLIC_PROTOCOLO_ENDPOINT   URL /exec de la hoja de cálculo
#   PUBLIC_PROTOCOLO_TOKEN      la misma cadena que el TOKEN del script de la hoja
#   PUBLIC_IOZEN_BOT            id del bot de ioZen. Vacío = sin chat
#
# Sin ninguna variable de poda se construye el sitio completo (16 páginas).
#
# La versión de Node NO se fija aquí: Oryx lee `engines` de `package.json`
# (>=22.12.0). Un `node-version` en el workflow sería un segundo sitio donde
# cambiarlo, y el que se olvida siempre es el segundo.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # LA PUERTA DEL REPOSITORIO, ANTES DE DESPLEGAR. Es el mismo comando que
      # se exige en local: astro check + build + los verificadores de dist/.
      # Un despliegue que no pasa por aquí publica lo que nadie ha comprobado.
      - name: Puerta de calidad
        run: npm ci && npm run check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SOLO_LANDING: ${{ vars.SOLO_LANDING }}
          SOLO_LANZAMIENTO: ${{ vars.SOLO_LANZAMIENTO }}
          PUBLIC_PROTOCOLO_ENDPOINT: ${{ vars.PUBLIC_PROTOCOLO_ENDPOINT }}
          PUBLIC_PROTOCOLO_TOKEN: ${{ vars.PUBLIC_PROTOCOLO_TOKEN }}
          PUBLIC_IOZEN_BOT: ${{ vars.PUBLIC_IOZEN_BOT }}

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_04B0A290F }}
          action: "upload"
          app_location: "/"
          api_location: ""
          # `dist` y no vacío: es la carpeta que genera Astro. Con el valor por
          # defecto Azure publicaba el código fuente.
          output_location: "dist"
          # Explícito y no el `npm run build` que Oryx adivina: `build:azure`
          # añade la poda de dist/ que necesitan el teaser y la puerta.
          app_build_command: "npm run build:azure"
          github_id_token: ${{ steps.idtoken.outputs.result }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SOLO_LANDING: ${{ vars.SOLO_LANDING }}
          SOLO_LANZAMIENTO: ${{ vars.SOLO_LANZAMIENTO }}
          PUBLIC_PROTOCOLO_ENDPOINT: ${{ vars.PUBLIC_PROTOCOLO_ENDPOINT }}
          PUBLIC_PROTOCOLO_TOKEN: ${{ vars.PUBLIC_PROTOCOLO_TOKEN }}
          PUBLIC_IOZEN_BOT: ${{ vars.PUBLIC_IOZEN_BOT }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_04B0A290F }}
          action: "close"
