# DESPLIEGUE DE LA LANDING (puerta de lanzamiento) EN AZURE STATIC WEB APPS.
#
# UN STATIC WEB APP SIRVE UN SITIO. Este repo publica dos, cada uno en su
# dominio y con su propio recurso de Azure:
#
#   este archivo                          landing  → SWA wonderful-rock-04b0a290f (followdafox.ec)
#   azure-static-web-apps-web.yml         web      → SWA de la web completa
#
# Un push a `main` dispara los dos; cada uno construye su variante del mismo
# código. Por eso el modo de poda está FIJO aquí y no en una variable: es lo que
# hace que este workflow sea el de la landing. Si viviera en una variable de
# repositorio la leerían los dos workflows y la web saldría podada también.
#
# Este archivo lo generó Azure con `output_location: ""`, que publica la RAÍZ
# DEL REPOSITORIO (los `.astro` sin construir). Está corregido abajo.
#
# VARIABLES DE REPOSITORIO (Settings › Secrets and variables › Actions ›
# Variables). Ninguna es un secreto: las `PUBLIC_*` acaban en el JavaScript
# del sitio.
#
#   SITE_URL_LANDING            https://followdafox.ec (canonical, robots, JSON-LD)
#   PUBLIC_PROTOCOLO_ENDPOINT   URL /exec de la hoja de cálculo   } compartidas
#   PUBLIC_PROTOCOLO_TOKEN      el TOKEN del script de la hoja    } con la web
#   PUBLIC_IOZEN_BOT            id del bot de ioZen. Vacío = sin chat
#
# El único secreto es el token de despliegue de este SWA.
#
# La versión de Node NO se fija aquí: Oryx lee `engines` de `package.json`.

name: Landing · Azure Static Web Apps

on:
  # Botón «Run workflow» en Actions: para publicar sin un push, p. ej. al
  # cargar el token o cambiar SITE_URL_*.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Valen para todos los pasos: la puerta de calidad y el build de Azure tienen
# que construir exactamente lo mismo, o se comprueba una cosa y se publica otra.
env:
  SITE_URL: ${{ vars.SITE_URL_LANDING }}
  SOLO_LANDING: ""
  SOLO_LANZAMIENTO: "1"
  PUBLIC_PROTOCOLO_ENDPOINT: ${{ vars.PUBLIC_PROTOCOLO_ENDPOINT }}
  PUBLIC_PROTOCOLO_TOKEN: ${{ vars.PUBLIC_PROTOCOLO_TOKEN }}
  PUBLIC_IOZEN_BOT: ${{ vars.PUBLIC_IOZEN_BOT }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # LA PUERTA DEL REPOSITORIO, ANTES DE DESPLEGAR: astro check + build +
      # los verificadores de dist/. Lo que no pasa aquí no se publica.
      - name: Puerta de calidad
        run: npm ci && npm run check

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_04B0A290F }}
          action: "upload"
          app_location: "/"
          api_location: ""
          # `dist`: la carpeta que genera Astro.
          output_location: "dist"
          # `build:azure` y no el `npm run build` que Oryx adivina: añade la poda.
          app_build_command: "npm run build:azure"
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_ROCK_04B0A290F }}
          action: "close"
